<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Sign in</h1>
    <p class="subtitle">Welcome back to TestFlow</p>

    <label class="field">
      <span>Email</span>
      <input type="email" formControlName="email" placeholder="you@company.com" autocomplete="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="error">
          @if (form.controls.email.errors?.['required']) { Email is required }
          @else if (form.controls.email.errors?.['email']) { Enter a valid email }
        </small>
      }
    </label>

    <label class="field">
      <span>Password</span>
      <div class="password-input">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.6 18.6 0 0 1 5.06-5.94M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </div>
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="error">Password is required</small>
      }
    </label>

    <button type="submit" class="primary-btn" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="switch-link">
      Don't have an account? <a routerLink="/register">Register</a>
    </p>
  </form>
</div>
